<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6efe3">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=./">
  <title>匠心工坊 · 正在进入 App</title>
  <style>
    :root {
      color-scheme: light;
      --paper: #f6efe3;
      --surface: #fffaf1;
      --ink: #29251f;
      --muted: #6f665b;
      --green: #2f4c3f;
      --line: #e6d8c6;
    }

    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    html,
    body {
      min-height: 100%;
      margin: 0;
    }

    body {
      display: grid;
      place-items: center;
      min-height: 100vh;
      min-height: 100dvh;
      padding: 24px;
      background:
        radial-gradient(circle at 50% 10%, #fffdf8 0, transparent 42%),
        var(--paper);
      color: var(--ink);
      font-family: "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Noto Sans SC", sans-serif;
      text-align: center;
    }

    main {
      width: min(100%, 360px);
      padding: 32px 24px;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--surface);
      box-shadow: 0 12px 34px rgba(55, 39, 25, 0.1);
    }

    .mark {
      display: grid;
      place-items: center;
      width: 56px;
      height: 56px;
      margin: 0 auto 18px;
      border-radius: 50%;
      background: var(--green);
      color: #fffdf8;
      font-size: 26px;
      line-height: 1;
    }

    h1 {
      margin: 0 0 10px;
      font-size: 22px;
      line-height: 1.35;
      letter-spacing: 0.04em;
    }

    p {
      margin: 0;
      color: var(--muted);
      font-size: 14px;
      line-height: 1.8;
    }

    a {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      margin-top: 20px;
      padding: 0 22px;
      border-radius: 999px;
      background: var(--green);
      color: #fffdf8;
      font-size: 14px;
      font-weight: 700;
      text-decoration: none;
    }

    a:focus-visible {
      outline: 3px solid #b7793b;
      outline-offset: 3px;
    }
  </style>
  <script>
    (function () {
      var target = new URL("./", window.location.href);
      target.search = window.location.search;
      target.hash = window.location.hash;
      window.location.replace(target.href);
    })();
  </script>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">光</div>
    <h1>正在进入匠心工坊</h1>
    <p>如果页面没有自动跳转，请点下面的按钮进入 App。</p>
    <a href="./">进入 App</a>
  </main>
</body>
</html>
